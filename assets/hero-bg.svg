<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 580" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef6e4"/>
      <stop offset="60%" stop-color="#fdecd0"/>
      <stop offset="100%" stop-color="#fbe0b8"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8d89a"/>
      <stop offset="100%" stop-color="#8ec870"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#96cc72"/>
      <stop offset="100%" stop-color="#72b850"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec85a"/>
      <stop offset="100%" stop-color="#5aaa3a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe080" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffcc50" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1400" height="580" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="1100" cy="70" r="90" fill="url(#sun)"/>
  <circle cx="1100" cy="70" r="44" fill="#ffe080" opacity="0.55"/>
  <circle cx="1100" cy="70" r="28" fill="#fff0a0" opacity="0.7"/>

  <!-- Clouds -->
  <g opacity="0.92">
    <ellipse cx="160" cy="95" rx="88" ry="30" fill="white"/>
    <ellipse cx="210" cy="78" rx="68" ry="38" fill="white"/>
    <ellipse cx="115" cy="108" rx="54" ry="24" fill="white"/>
    <ellipse cx="255" cy="92" rx="42" ry="22" fill="white"/>
  </g>
  <g opacity="0.85">
    <ellipse cx="860" cy="72" rx="76" ry="28" fill="white"/>
    <ellipse cx="910" cy="58" rx="58" ry="34" fill="white"/>
    <ellipse cx="815" cy="85" rx="48" ry="22" fill="white"/>
    <ellipse cx="948" cy="76" rx="36" ry="20" fill="white"/>
  </g>
  <g opacity="0.80">
    <ellipse cx="1280" cy="105" rx="66" ry="26" fill="white"/>
    <ellipse cx="1325" cy="90" rx="52" ry="32" fill="white"/>
    <ellipse cx="1240" cy="115" rx="44" ry="20" fill="white"/>
  </g>
  <g opacity="0.70">
    <ellipse cx="520" cy="115" rx="58" ry="22" fill="white"/>
    <ellipse cx="558" cy="102" rx="44" ry="28" fill="white"/>
    <ellipse cx="484" cy="125" rx="38" ry="18" fill="white"/>
  </g>

  <!-- Floating dandelion seeds -->
  <circle cx="390" cy="220" r="2.5" fill="white" opacity="0.65"/>
  <circle cx="404" cy="208" r="1.8" fill="white" opacity="0.55"/>
  <circle cx="378" cy="235" r="2" fill="white" opacity="0.6"/>
  <circle cx="412" cy="240" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="700" cy="190" r="2.2" fill="white" opacity="0.6"/>
  <circle cx="715" cy="202" r="1.6" fill="white" opacity="0.5"/>
  <circle cx="690" cy="210" r="1.8" fill="white" opacity="0.55"/>

  <!-- Far hills -->
  <path d="M0 320 Q180 248 360 280 Q540 250 720 272 Q900 248 1080 268 Q1250 252 1400 268 L1400 580 L0 580 Z" fill="url(#hill1)" opacity="0.85"/>

  <!-- Mid hills -->
  <path d="M0 380 Q160 338 320 355 Q520 325 720 348 Q920 322 1100 344 Q1280 328 1400 342 L1400 580 L0 580 Z" fill="url(#hill2)"/>

  <!-- Ground -->
  <path d="M0 460 Q220 438 440 450 Q700 430 960 448 Q1180 434 1400 446 L1400 580 L0 580 Z" fill="url(#ground)"/>
  <rect x="0" y="540" width="1400" height="40" fill="#52a035"/>

  <!-- Grass blades (hint) -->
  <path d="M80 460 Q82 445 86 460" stroke="#48962e" stroke-width="2" fill="none"/>
  <path d="M200 455 Q202 440 206 455" stroke="#48962e" stroke-width="2" fill="none"/>
  <path d="M520 452 Q522 436 526 452" stroke="#48962e" stroke-width="2" fill="none"/>
  <path d="M900 456 Q902 440 906 456" stroke="#48962e" stroke-width="2" fill="none"/>
  <path d="M1200 453 Q1202 438 1206 453" stroke="#48962e" stroke-width="2" fill="none"/>

  <!-- Flowers -->
  <g>
    <circle cx="62" cy="463" r="6" fill="#ffd040"/><circle cx="62" cy="455" r="3" fill="#fff0a0"/>
    <circle cx="148" cy="468" r="5" fill="#ff9060"/><circle cx="148" cy="461" r="2.5" fill="#ffe0c0"/>
    <circle cx="235" cy="462" r="6" fill="#ffd040"/><circle cx="235" cy="454" r="3" fill="#fff0a0"/>
    <circle cx="315" cy="470" r="4.5" fill="white" opacity="0.9"/>
    <circle cx="425" cy="465" r="5.5" fill="#ffd040"/>
    <circle cx="510" cy="458" r="4" fill="white" opacity="0.9"/>
    <circle cx="640" cy="468" r="6" fill="#ff9060"/>
    <circle cx="760" cy="462" r="5" fill="#ffd040"/>
    <circle cx="850" cy="470" r="4.5" fill="white" opacity="0.9"/>
    <circle cx="1000" cy="464" r="6" fill="#ffd040"/>
    <circle cx="1120" cy="468" r="5" fill="#ff9060"/>
    <circle cx="1230" cy="460" r="6" fill="#ffd040"/>
    <circle cx="1340" cy="467" r="5" fill="white" opacity="0.9"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffd040" opacity="0.8">
    <path d="M430 320 l2-8 2 8 8 2-8 2-2 8-2-8-8-2z"/>
    <path d="M1020 300 l2-7 2 7 7 2-7 2-2 7-2-7-7-2z"/>
  </g>
  <g fill="white" opacity="0.75">
    <path d="M750 280 l1.5-6 1.5 6 6 1.5-6 1.5-1.5 6-1.5-6-6-1.5z"/>
    <path d="M1180 330 l1.2-5 1.2 5 5 1.2-5 1.2-1.2 5-1.2-5-5-1.2z"/>
    <path d="M200 340 l1.2-5 1.2 5 5 1.2-5 1.2-1.2 5-1.2-5-5-1.2z"/>
  </g>

  <!-- ===== CHILD 1 — Girl in coral dress, arms wide (x=290) ===== -->
  <g transform="translate(290,370)">
    <!-- shadow -->
    <ellipse cx="0" cy="130" rx="38" ry="9" fill="#2a5020" opacity="0.18"/>
    <!-- legs -->
    <line x1="-12" y1="105" x2="-18" y2="130" stroke="#f5c5a0" stroke-width="11" stroke-linecap="round"/>
    <line x1="10" y1="103" x2="16" y2="130" stroke="#f5c5a0" stroke-width="11" stroke-linecap="round"/>
    <!-- shoes -->
    <ellipse cx="-18" cy="132" rx="11" ry="6" fill="#b05840"/>
    <ellipse cx="17" cy="132" rx="11" ry="6" fill="#b05840"/>
    <!-- dress body -->
    <path d="M-30 38 Q0 48 30 38 L36 106 Q0 118 -36 106 Z" fill="#e8845a"/>
    <!-- dress skirt billowing -->
    <path d="M-36 106 Q-20 128 0 123 Q20 128 36 106" fill="#e07848" opacity="0.9"/>
    <!-- collar -->
    <path d="M-14 38 Q0 46 14 38" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- arms spread wide -->
    <line x1="-28" y1="52" x2="-72" y2="38" stroke="#f5c5a0" stroke-width="11" stroke-linecap="round"/>
    <line x1="28" y1="52" x2="72" y2="38" stroke="#f5c5a0" stroke-width="11" stroke-linecap="round"/>
    <!-- hands -->
    <circle cx="-74" cy="37" r="8" fill="#f5c5a0"/>
    <circle cx="74" cy="37" r="8" fill="#f5c5a0"/>
    <!-- neck -->
    <rect x="-7" y="22" width="14" height="20" rx="6" fill="#f5c5a0"/>
    <!-- head -->
    <circle cx="0" cy="0" r="40" fill="#f5c5a0"/>
    <!-- hair -->
    <path d="M-38 -14 Q0 -52 38 -14 Q30 -52 0 -56 Q-30 -52 -38 -14 Z" fill="#2e1e0e"/>
    <!-- pigtail left -->
    <path d="M-36 -10 Q-52 -2 -48 14 Q-38 10 -36 -10 Z" fill="#2e1e0e"/>
    <!-- pigtail right -->
    <path d="M36 -10 Q52 -2 48 14 Q38 10 36 -10 Z" fill="#2e1e0e"/>
    <!-- hair tie -->
    <circle cx="-44" cy="8" r="5" fill="#e8845a"/>
    <circle cx="44" cy="8" r="5" fill="#e8845a"/>
    <!-- eyes -->
    <ellipse cx="-13" cy="4" rx="9" ry="10" fill="#2e1e0e"/>
    <ellipse cx="13" cy="4" rx="9" ry="10" fill="#2e1e0e"/>
    <!-- eye shine -->
    <circle cx="-10" cy="1" r="3.5" fill="white"/>
    <circle cx="16" cy="1" r="3.5" fill="white"/>
    <circle cx="-11" cy="0" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="15" cy="0" r="1.5" fill="white" opacity="0.6"/>
    <!-- smile -->
    <path d="M-12 16 Q0 26 12 16" stroke="#c06040" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="-18" cy="14" r="9" fill="#f08070" opacity="0.32"/>
    <circle cx="18" cy="14" r="9" fill="#f08070" opacity="0.32"/>
    <!-- eyelashes top -->
    <path d="M-22 -3 Q-18 -8 -13 -6 Q-8 -8 -4 -3" stroke="#2e1e0e" stroke-width="1.5" fill="none"/>
    <path d="M4 -3 Q8 -8 13 -6 Q18 -8 22 -3" stroke="#2e1e0e" stroke-width="1.5" fill="none"/>
  </g>

  <!-- ===== CHILD 2 — Boy jumping, blue shirt (x=650) ===== -->
  <g transform="translate(650,355)">
    <!-- shadow (small — jumping) -->
    <ellipse cx="0" cy="148" rx="28" ry="6" fill="#2a5020" opacity="0.14"/>
    <!-- legs apart (jumping) -->
    <line x1="-10" y1="108" x2="-22" y2="138" stroke="#4a3828" stroke-width="12" stroke-linecap="round"/>
    <line x1="10" y1="106" x2="22" y2="136" stroke="#4a3828" stroke-width="12" stroke-linecap="round"/>
    <!-- sneakers -->
    <ellipse cx="-22" cy="140" rx="13" ry="7" fill="#e0e8f0"/>
    <ellipse cx="23" cy="140" rx="13" ry="7" fill="#e0e8f0"/>
    <!-- shirt body -->
    <path d="M-28 36 Q0 46 28 36 L32 108 Q0 120 -32 108 Z" fill="#5b8fb9"/>
    <!-- stripe on shirt -->
    <path d="M-28 70 Q0 78 28 70" stroke="white" stroke-width="3" fill="none" opacity="0.5"/>
    <!-- arms up excited -->
    <line x1="-24" y1="50" x2="-58" y2="18" stroke="#f5c5a0" stroke-width="11" stroke-linecap="round"/>
    <line x1="24" y1="50" x2="58" y2="18" stroke="#f5c5a0" stroke-width="11" stroke-linecap="round"/>
    <!-- hands -->
    <circle cx="-60" cy="16" r="8" fill="#f5c5a0"/>
    <circle cx="60" cy="16" r="8" fill="#f5c5a0"/>
    <!-- neck -->
    <rect x="-7" y="22" width="14" height="18" rx="6" fill="#f5c5a0"/>
    <!-- head -->
    <circle cx="0" cy="0" r="38" fill="#f5c5a0"/>
    <!-- bowl cut hair -->
    <path d="M-36 -12 Q0 -50 36 -12 Q28 -48 0 -52 Q-28 -48 -36 -12 Z" fill="#2e1e0e"/>
    <path d="M-36 -12 Q-40 2 -38 8" stroke="#2e1e0e" stroke-width="5" fill="none"/>
    <path d="M36 -12 Q40 2 38 8" stroke="#2e1e0e" stroke-width="5" fill="none"/>
    <!-- eyes — laughing crescent -->
    <path d="M-20 4 Q-13 -4 -6 4" stroke="#2e1e0e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M6 4 Q13 -4 20 4" stroke="#2e1e0e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- big laugh mouth -->
    <path d="M-14 14 Q0 28 14 14" stroke="#c06040" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-14 14 Q0 28 14 14" stroke="none" fill="#f08070" opacity="0.4"/>
    <!-- cheeks big -->
    <circle cx="-20" cy="12" r="10" fill="#f08070" opacity="0.35"/>
    <circle cx="20" cy="12" r="10" fill="#f08070" opacity="0.35"/>
  </g>

  <!-- ===== CHILD 3 — Girl spinning yellow dress (x=980) ===== -->
  <g transform="translate(980,375)">
    <!-- shadow -->
    <ellipse cx="0" cy="128" rx="36" ry="8" fill="#2a5020" opacity="0.18"/>
    <!-- legs -->
    <line x1="-10" y1="100" x2="-15" y2="126" stroke="#f5c5a0" stroke-width="11" stroke-linecap="round"/>
    <line x1="10" y1="100" x2="18" y2="124" stroke="#f5c5a0" stroke-width="11" stroke-linecap="round"/>
    <!-- shoes -->
    <ellipse cx="-16" cy="128" rx="11" ry="6" fill="#d04878"/>
    <ellipse cx="18" cy="126" rx="11" ry="6" fill="#d04878"/>
    <!-- spinning dress -->
    <path d="M-32 36 Q0 46 32 36 L42 102 Q0 116 -42 102 Z" fill="#e8c840"/>
    <!-- wide spin skirt -->
    <path d="M-42 102 Q-25 130 0 124 Q25 130 42 102 Q55 118 50 128 Q20 145 0 140 Q-20 145 -50 128 Q-55 118 -42 102 Z" fill="#e0bc38" opacity="0.88"/>
    <!-- collar bow -->
    <path d="M-8 36 Q0 42 8 36" stroke="#fff0a0" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- arms spinning out -->
    <line x1="-30" y1="50" x2="-70" y2="36" stroke="#f5c5a0" stroke-width="11" stroke-linecap="round"/>
    <line x1="30" y1="50" x2="68" y2="34" stroke="#f5c5a0" stroke-width="11" stroke-linecap="round"/>
    <!-- hands -->
    <circle cx="-72" cy="35" r="8" fill="#f5c5a0"/>
    <circle cx="70" cy="33" r="8" fill="#f5c5a0"/>
    <!-- neck -->
    <rect x="-7" y="22" width="14" height="18" rx="6" fill="#f5c5a0"/>
    <!-- head tilted slightly -->
    <circle cx="4" cy="0" r="39" fill="#f5c5a0"/>
    <!-- long flowing hair -->
    <path d="M-33 -12 Q4 -50 41 -12 Q33 -50 4 -54 Q-25 -50 -33 -12 Z" fill="#2e1e0e"/>
    <!-- long hair sides -->
    <path d="M-33 -12 Q-40 30 -35 60" stroke="#2e1e0e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M41 -12 Q48 30 43 60" stroke="#2e1e0e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- hair highlight -->
    <path d="M-10 -44 Q4 -50 18 -44" stroke="#5a3a1e" stroke-width="3" fill="none" opacity="0.5"/>
    <!-- eyes sparkly -->
    <ellipse cx="-6" cy="4" rx="9" ry="10" fill="#2e1e0e"/>
    <ellipse cx="18" cy="4" rx="9" ry="10" fill="#2e1e0e"/>
    <circle cx="-3" cy="1" r="3.5" fill="white"/>
    <circle cx="21" cy="1" r="3.5" fill="white"/>
    <circle cx="-4" cy="0" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="20" cy="0" r="1.5" fill="white" opacity="0.6"/>
    <!-- extra sparkle in eye -->
    <circle cx="-8" cy="6" r="1" fill="white" opacity="0.8"/>
    <circle cx="16" cy="6" r="1" fill="white" opacity="0.8"/>
    <!-- smile -->
    <path d="M-8 16 Q4 27 16 16" stroke="#c06040" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="-14" cy="14" r="9" fill="#f08070" opacity="0.32"/>
    <circle cx="22" cy="14" r="9" fill="#f08070" opacity="0.32"/>
    <!-- eyelashes -->
    <path d="M-15 -4 Q-11 -9 -6 -6 Q-1 -9 3 -4" stroke="#2e1e0e" stroke-width="1.5" fill="none"/>
    <path d="M9 -4 Q13 -9 18 -6 Q23 -9 27 -4" stroke="#2e1e0e" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Flying leaves / petals -->
  <ellipse cx="450" cy="310" rx="8" ry="4" fill="#90c860" opacity="0.6" transform="rotate(-30,450,310)"/>
  <ellipse cx="820" cy="270" rx="7" ry="3.5" fill="#ffd040" opacity="0.55" transform="rotate(20,820,270)"/>
  <ellipse cx="1200" cy="300" rx="8" ry="4" fill="#90c860" opacity="0.5" transform="rotate(-15,1200,300)"/>
  <ellipse cx="150" cy="290" rx="6" ry="3" fill="#ffd040" opacity="0.5" transform="rotate(25,150,290)"/>

  <!-- Rainbow faint arc -->
  <path d="M100 450 Q700 100 1300 450" stroke="none" fill="none" stroke-width="0"/>
  <path d="M120 460 Q700 150 1280 460" stroke="#f08070" stroke-width="4" fill="none" opacity="0.08"/>
  <path d="M130 462 Q700 165 1270 462" stroke="#ffd040" stroke-width="4" fill="none" opacity="0.08"/>
  <path d="M140 464 Q700 178 1260 464" stroke="#80c860" stroke-width="4" fill="none" opacity="0.08"/>
</svg>
